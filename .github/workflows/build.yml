name: Make APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Scaffold Android project
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.fittrack --project-name fittrack_ai .
          cp -r android ../
          cd ..
          rm -rf temp_app

      - name: Update Kotlin, SDK & Permissions
        run: |
          # Upgrade Kotlin version to 1.9.22 to match plugin dependencies
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''1.9.22'\''/' android/build.gradle || true

          # Adjust SDK versions
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' android/app/build.gradle || true

          # Inject background and hardware permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
